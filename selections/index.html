<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/images/common/favicon.svg">
<title>Gabriela Projects Selections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700&family=Lora:ital,wght@1,400;1,500&display=swap">
<style>
:root{
  --bg:#F2F2EF; --surface:#FFFFFF; --sunk:#E8E8E4; --stage:#E4E3DE; --ink:#151515; --ink2:#55544F; --ink3:#8A8983; --line:#DDDCD6;
  --band:#151515; --band-ink:#F4F4F1; --band-ink2:#A9A8A2;
  --accent:#8C6A2F; --accent-ink:#FFFFFF; --accent-soft:#F1E9DA;
  --ok:#2E7650; --okbg:#E3F0E8; --warn:#B07A14;
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --serif:"Lora",Georgia,serif;
  --sans:"Figtree",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121211; --surface:#1C1C1B; --sunk:#262624; --stage:#2A2A27; --ink:#EDECE8; --ink2:#B3B2AC; --ink3:#7F7E78; --line:#31302D;
    --band:#000; --band-ink:#F4F4F1; --band-ink2:#8F8E88;
    --accent:#C9A15E; --accent-ink:#161310; --accent-soft:#2E2618;
    --ok:#6CC293; --okbg:#1B2E23; --warn:#E0AE55;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1C1C1B; --sunk:#262624; --stage:#2A2A27; --ink:#EDECE8; --ink2:#B3B2AC; --ink3:#7F7E78; --line:#31302D;
  --band:#000; --band-ink:#F4F4F1; --band-ink2:#8F8E88;
  --accent:#C9A15E; --accent-ink:#161310; --accent-soft:#2E2618;
  --ok:#6CC293; --okbg:#1B2E23; --warn:#E0AE55;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.band{background:var(--band);color:var(--band-ink)}
.band-in{max-width:1360px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.gmark{width:38px;height:38px;border:1.5px solid var(--band-ink);display:grid;place-items:center;font-family:var(--display);font-size:28px;line-height:1;padding-top:3px;flex:none}
.brand-t{display:flex;flex-direction:column}
.brand-t b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.08em;line-height:1}
.brand-t i{font-family:var(--serif);font-size:13px;color:var(--band-ink2)}
.band select{background:transparent;border:1px solid #3a3a37;color:var(--band-ink);border-radius:6px;padding:7px 10px;max-width:260px}
.band select option{color:#151515;background:#fff}
.band label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--band-ink2);display:flex;align-items:center;gap:8px}

main{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px}

.phead{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between}
.phead h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.4vw,46px);letter-spacing:.02em;line-height:.95;margin:0;text-wrap:balance}
.phead .sub{font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:15px;margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.views{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);align-self:flex-start}
.views button{border:0;background:none;padding:8px 16px;cursor:pointer;color:var(--ink2);font-weight:600}
.views button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 12px 9px;cursor:pointer;color:var(--ink2);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.tab .dot.ok{background:var(--ok)} .tab .dot.none{background:var(--line)}
.tab.add{color:var(--accent)}

.stage{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(340px,1fr);gap:28px;align-items:start}
.viz{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px}
.canvas{background:var(--stage);border-radius:14px;position:relative;overflow:hidden}
.canvas svg{display:block;width:100%;height:auto;max-height:calc(100vh - 250px);margin:0 auto}
.canvas .rname{position:absolute;left:16px;top:12px;font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink)}
.canvas .hint{position:absolute;right:14px;bottom:10px;font-size:11.5px;color:var(--ink3)}
.turn{position:absolute;right:12px;top:10px;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px}
.tbtn{border:0;background:transparent;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:17px;line-height:1;color:var(--ink);display:grid;place-items:center}
.tbtn:hover{background:var(--accent-soft);color:var(--accent)}
.tlbl{font-size:11.5px;font-weight:600;color:var(--ink2);padding:0 4px;white-space:nowrap}
.iso .s{transition:opacity .18s}
.iso.focusing .s:not(.on){opacity:.5}
.iso .s[data-slot]{cursor:pointer}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px 16px}
.chipf{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);border:0;background:none;padding:0;cursor:pointer;text-align:left}
.chipf .sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.18);flex:none}
.chipf b{color:var(--ink);font-weight:600}
.approve{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.approve .tot{margin-right:auto;font-size:13px;color:var(--ink2)}
.approve .tot b{font-family:var(--display);font-size:24px;font-weight:400;color:var(--ink);letter-spacing:.02em;margin-left:4px}
.approve .wait{font-size:13px;color:var(--ink2)}
.stamp{display:inline-flex;align-items:center;gap:6px;background:var(--okbg);color:var(--ok);font-weight:700;padding:7px 12px;border-radius:99px;font-size:13px}
.refs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.refs button{flex:none;border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;cursor:zoom-in;background:var(--sunk);height:84px}
.refs img{height:100%;width:auto;display:block}

.picks{display:flex;flex-direction:column;gap:22px}
.slot{display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px;border-radius:12px;transition:background .3s,box-shadow .3s}
.slot.flash{background:var(--accent-soft);box-shadow:0 0 0 8px var(--accent-soft)}
.slot-h{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap}
.slot-h h3,.sec-h{margin:0;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.04em;line-height:1}
.slot-h .cur{font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:14px}
.slot-h .edit{margin-left:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink3)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.opt:disabled{cursor:default}
.opt .thumb{aspect-ratio:1/1;max-width:100%;position:relative;background:var(--sunk)}
.opt .thumb svg,.opt .thumb img{width:100%;height:100%;display:block;object-fit:cover}
.opt .check{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700}
.opt .meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.opt .n{font-weight:600;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.opt .d{font-size:12px;color:var(--ink2);line-height:1.3}
.opt .p{font-size:12px;font-weight:600;color:var(--ink3);margin-top:3px}
.opt .st{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-top:2px}
.lpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lpick button{border:1.5px solid var(--line);border-radius:10px;background:var(--stage);padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;font-weight:600;font-size:12.5px;color:var(--ink)}
.lpick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.lpick svg{width:100%;height:auto}
.opt .p.up{color:var(--accent)}
.slot-h .catb{margin-left:auto} .slot-h .catb + .edit{margin-left:0}
.catf{display:flex;flex-wrap:wrap;gap:6px}
.catf .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.catg{margin:6px 0 0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.link{font-size:12.5px;color:var(--accent);font-weight:600}
.opt .vlink{font-size:12px;font-weight:600;color:var(--accent);text-decoration:underline;margin-top:4px;align-self:flex-start;cursor:pointer}

.speclist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.speclist .grp{padding:8px 14px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:700;background:var(--sunk)}
.si{display:grid;grid-template-columns:130px 1fr auto;gap:4px 14px;padding:10px 14px;border-top:1px solid var(--line);align-items:baseline;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.si.click{cursor:pointer}.si.click:hover{background:var(--accent-soft)}
.si .loc{font-size:12.5px;color:var(--ink2);font-weight:600}
.si .nm{font-size:13.5px;overflow-wrap:anywhere}
.si .nm small{display:block;color:var(--ink2);font-size:12px}
.si .q{font-size:12px;color:var(--ink3);white-space:nowrap}
.muted{color:var(--ink3);font-style:italic}
@media (max-width:560px){.si{grid-template-columns:1fr auto}.si .loc{grid-column:1/-1}}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;color:var(--ink2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toolbar input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;flex:1 1 160px;max-width:280px;min-width:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;background:var(--sunk);white-space:nowrap}
td{min-width:90px}
td.w{min-width:220px}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--accent-soft)}
tr.g td{background:var(--bg);font-family:var(--display);font-size:19px;letter-spacing:.05em;cursor:default;padding-top:14px}
.sw-i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.2);vertical-align:-1px;margin-right:6px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-left:6px;white-space:nowrap}

.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;align-items:start}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.plan button.img{border:0;padding:0;background:var(--sunk);cursor:zoom-in;aspect-ratio:4/3;max-width:100%;display:block;width:100%}
.plan img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.plan .pb{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.plan h4{margin:0;font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.04em;line-height:1}
.plan .rt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.plan p{margin:0;font-size:13px;color:var(--ink2);white-space:pre-line}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.danger{color:#B03A2A;border-color:#B03A2A;background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.empty{padding:40px 20px;text-align:center;color:var(--ink2);border:1.5px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.03em;color:var(--ink)}

.scrim{position:fixed;inset:0;background:rgba(10,10,10,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dhead h3{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.03em;margin:0;margin-right:auto;line-height:1}
.dbody{overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;flex:1}
.dbody>*{flex:none}
.dbody p{margin:0;color:var(--ink2)}
.dfoot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.sp{flex:1}
.orow{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:84px 1fr;gap:12px}
.orow .thumb{width:84px;height:84px;border-radius:8px;overflow:hidden;background:var(--sunk)}
.dropzone{position:relative;cursor:copy;outline-offset:2px}
.dropzone .dz-hint{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;font-weight:700;text-align:center;padding:3px 2px;background:rgba(20,20,20,.62);color:#fff;opacity:0;transition:opacity .15s}
.dropzone:hover .dz-hint,.dropzone:focus .dz-hint,.dropzone.over .dz-hint{opacity:1}
.dropzone.over,.dropzone:focus{box-shadow:0 0 0 2px var(--accent)}
.orow .thumb svg,.orow .thumb img{width:100%;height:100%;display:block;object-fit:cover}
.ofields{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 10px;min-width:0}
.f{display:flex;flex-direction:column;gap:3px;grid-column:span 3;min-width:0}
.f.w6{grid-column:span 6}.f.w2{grid-column:span 2}
.f label{font-size:11.5px;color:var(--ink2);font-weight:500}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f input[type=color]{padding:2px;height:34px}
details.more{grid-column:1/-1}
details.more summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--accent);padding:4px 0}
details.more .ofields{margin-top:8px}
.oacts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:#B03A2A}
.typepick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.typepick button{border:1.5px solid var(--line);border-radius:10px;background:var(--stage);padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;font-weight:600;font-size:13px}
.typepick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.typepick svg{width:100%;height:auto}
.typepick .gen{aspect-ratio:4/3;width:100%;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--ink3)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}

.lb{position:fixed;inset:0;z-index:30;background:rgba(8,8,8,.92);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
.lb-top{display:flex;align-items:center;gap:10px;color:#f4f4f1}
.lb-top h3{margin:0 auto 0 0;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em}
.lb-top .btn{background:transparent;color:#f4f4f1;border-color:#444}
.lb-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 0}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:4px}
.lb-notes{color:#d8d7d2;font-size:13.5px;white-space:pre-line;max-height:22vh;overflow:auto;max-width:900px;margin:0 auto;width:100%}

.drawer.wide{width:min(1180px,100%)}
.le{gap:12px}
.le-top{grid-template-columns:repeat(8,1fr)}
.le-add{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}
.le-main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.le-plan{background:var(--sunk);border-radius:10px;padding:6px}
.le-plan svg{width:100%;height:auto;max-height:62vh;display:block;user-select:none}
.le-iso{background:var(--stage);border-radius:10px;position:relative}
.le-iso .turn{top:8px;right:8px}
.le-iso svg{width:100%;height:auto;max-height:36vh;display:block}
.le-side{display:flex;flex-direction:column;gap:12px}
.le-insp-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.le-hint{font-size:12.5px;color:var(--ink3)!important}
.pl-floor{fill:var(--surface)} .pl-grid{stroke:var(--line);stroke-width:.3} .pl-wall{fill:var(--ink)} .pl-open{fill:none;stroke:var(--ink3);stroke-width:.6;stroke-dasharray:3 3}
.pl-dim{font:600 6px var(--sans);fill:var(--ink2)} .pl-lbl{font-family:var(--sans);font-weight:600;fill:var(--ink);pointer-events:none}
.pl-swing{fill:none;stroke:var(--ink3);stroke-width:.5;stroke-dasharray:2 2}
.pi{cursor:grab} .pi.sel rect{stroke:var(--accent)!important}
.rot-h{cursor:pointer} .rot-h circle{fill:var(--accent)} .rot-h path{stroke:#fff;stroke-linecap:round;stroke-linejoin:round} .rot-h:hover circle{filter:brightness(1.12)}
.rh{cursor:pointer} .rh-hit{fill:var(--accent);opacity:.18} .rh-arrow{fill:var(--accent)} .rh:hover .rh-hit{opacity:.35}
.pl-dimsel{font:700 5px var(--sans);fill:var(--accent);pointer-events:none}
.stp{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--bg)}

const catFits = (r, f) => (f.rooms||[]).some(x => (CAT_ROOMS[r.type]||[]).includes(x));
async function loadCatalog(){
  let rows = null;
  try{ const c = window.claude, cat = c && c.use ? await c.use('catalog') : null; if(cat && cat.list) rows = await cat.list(); }catch(e){}
  if(!rows || !rows.length){ try{ rows = await (await fetch('finishes/finishes.json')).json(); }catch(e){ rows = []; } }
  S.catalog = rows; render();
}
function catalogFor(r, k){
  const cats = CAT_FOR[k]; if(!cats || !S.catalog) return [];
  return S.catalog.filter(f => cats.includes(f.category))
    .sort((a,b) => catFits(r,b) - catFits(r,a) || (b.popularity||0) - (a.popularity||0) || (a.sort_order||0) - (b.sort_order||0));
}
// a catalog finish as a slot option: its color and a matching pattern paint the drawing; shape (style, width) carries over from the current pick
function catalogOption(f, cur){
  const sub = String(f.subcategory||'').toLowerCase(), slug = f.slug, wood = /^wood/.test(f.color_family||'');
  let texture = 'plain', style, angle;
  switch(f.category){
    case 'Countertop': texture = /calacatta|carrara|quartzite|marble/.test(slug) ? 'marble' : sub==='wood' ? 'wood' : 'plain'; break;
    case 'Cabinetry': texture = wood ? 'wood' : 'plain'; style = sub==='slab' ? 'slab' : 'shaker'; break;
    case 'Wall tile': texture = {subway:'subway', zellige:'square', mosaic:'mosaic', dimensional:'reeded'}[sub] || 'large'; if(/vertical/.test(slug)) angle = 90; break;
    case 'Floor tile': texture = /hex/.test(slug) ? 'hex' : sub==='mosaic' ? 'mosaic' : 'large'; break;
    case 'Flooring': texture = /herringbone/.test(slug) ? 'herringbone' : sub==='carpet' ? 'plain' : 'plank'; break;
    case 'Vanity': texture = wood ? 'wood' : 'plain'; style = sub==='floating' ? 'floating_doors' : 'cabinet'; break;
    case 'Shower glass': style = 'frameless'; break;
  }
  const size = f.size && f.size!=='—' ? f.size : '';
  const o = {id:'cat-'+slug, name:f.name, detail:[f.finish, size].filter(Boolean).join(' · '), color:okHex(f.color_hex), texture, price:0,
    catalog:slug, imgUrl:catImg(slug), tier:f.price_tier||'', finish:f.finish||'', dims:size,
    notes:[f.notes, f.example_brands ? `Example brands: ${f.example_brands}.` : ''].filter(Boolean).join(' '), addedBy: role()==='designer' ? 'designer' : 'client'};
  const st = style || (cur && cur.style); if(st) o.style = st;
  if(angle) o.angle = angle;
  if(cur && cur.width) o.width = cur.width;
  if(cur && cur.color2 && f.category==='Appliance finish') o.color2 = cur.color2;
  Object.keys(o).forEach(k => { if(o[k]==='') delete o[k]; });
  return o;
}

  return {name: name || t.label, type, slots, approved:null, order: Date.now()};
}

}
function selectProject(pid){
  S.unsubs.forEach(u=>u()); S.unsubs=[];
  S.pid=pid; S.rooms=[]; S.specs=[]; S.plans=[]; S.photos={};
  if(pid && S.db){
    S.loading = 1;

async function pickCatalog(k, slug){

// Quantities measured from a room's saved layout (estimates, in square feet). Only rooms with a drawn layout get them.
function roomTakeoff(r){

    let bs = 0, ct = 0, isl = 0;

      if(['base','sink','range'].includes(it.t) && ((it.y < 2 && !(p.open||[]).includes('back')) || (it.x < 2 && !(p.open||[]).includes('left')))){ const top = it.backsplash ? +it.backsplash : 54; bs += (fc==='e'||fc==='w' ? it.d : it.w) * Math.max(0, top - 36); }
      if(it.t==='base' || it.t==='sink') ct += (it.w + (fc==='e'||fc==='w'?1:0)) * (it.d + (fc==='s'||fc==='n'?1:0)) + (+it.oh||0) * (ohDir(it)==='e'||ohDir(it)==='w' ? it.d : it.w);

function render(){
  const ps = $('#projSel');
  ps.innerHTML = S.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===S.pid?'selected':''}>${esc(p.name)}</option>`).join('') + (S.role==='designer'&&!S.demo ? '<option value="__new">+ New project…</option>' : '');
  if(!S.projects.length && S.role!=='designer') ps.innerHTML='<option>No projects yet</option>';
  $('#viewAsWrap').hidden = !(S.role==='designer' && !S.demo);
  $('#viewAs').value = S.viewAs;

  const app = $('#app');
  if(!S.ready){ app.innerHTML='<div class="loading">Loading your rooms…</div>'; return; }
  const keepScroll = window.scrollY;
  const qFocus = document.activeElement && document.activeElement.id==='q';
  let h='';
  if(S.demo) h += '<div class="banner">Demo with sample finishes. Open the published app to save selections.</div>';
  if(S.error) h += `<div class="banner">${esc(S.error)}</div>`;
  const p = project();
  if(!p){
    h += `<div class="empty"><h3>No projects yet</h3><p>${S.role==='designer'?'Create a project, then add the rooms your client is choosing finishes for.':'Gabriela Projects has not shared selections with you yet.'}</p>${S.role==='designer'&&!S.demo?'<button class="btn accent" data-act="newProject">+ New project</button>':''}</div>`;
    app.innerHTML=h; renderOverlay(); return;
  }
  if(S.role==='designer' && S.viewAs==='client') h += '<div class="banner">Previewing what your client sees. They pick finishes and approve each room.</div>';
  const meta = [p.client, p.address].filter(Boolean).join(' · ');
  h += `<section class="phead"><div><h1>${esc(p.name)}</h1><div class="sub">${esc(meta)}${p.note?` · ${esc(p.note)}`:''}</div></div>${canManage()?`<div class="acts"><button class="btn" data-act="editProject">Project details</button></div>`:''}</section>`;
  h += `<div class="views" role="tablist" aria-label="Sections">${[['rooms','Rooms'],['schedule','Schedule'],['plans','Plans & notes']].map(([k,l])=>`<button role="tab" aria-selected="${S.view===k}" data-act="view" data-v="${k}">${l}${k==='plans'&&S.plans.length?` (${S.plans.length})`:''}</button>`).join('')}</div>`;

  else if(S.view==='plans') h += plansHTML();

  window.scrollTo(0, keepScroll);
  if(qFocus){ const q=$('#q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }

  h += `<div class="tablewrap"><table><thead><tr><th>Category</th><th>Item</th><th>Where</th><th>Total</th><th>Order (with waste)</th><th>Link</th></tr></thead><tbody>`;

    const sub = [g.manufacturer, g.model, g.finish, g.dims].filter(Boolean).join(' · ');
    const where = g.uses.map(u => `<div>${esc(roomName(u.room))}${u.location?` · <span style="color:var(--ink2)">${esc(u.location)}</span>`:''}${u.q?` <b style="white-space:nowrap">${u.auto?'≈ ':''}${esc(fmtQty(u.q))}</b>`:''}</div>`).join('');
    h += `<tr><td>${g.uses.length>1?`<span class="tag" style="margin:0">×${g.uses.length}</span>`:''}</td>
      <td class="w">${g.color?`<span class="sw-i" style="background:${okHex(g.color)}"></span>`:''}<b>${esc(g.name)}</b>${sub?`<small style="display:block;color:var(--ink2)">${esc(sub)}</small>`:''}</td>
      <td class="w" style="font-size:12.5px">${where}</td>
      <td style="white-space:nowrap">${tot ? (anyAuto?'≈ ':'') + esc(tot) : '<span class="muted">No qty</span>'}${tot && missing ? `<small style="display:block;color:var(--warn)">${missing} without qty</small>` : ''}</td>

function renderOverlay(){
  const o = $('#overlay');
  if(S.lb){ o.innerHTML = lightboxHTML(); return; }
  const d = S.drawer;
  if(!d){ o.innerHTML=''; return; }
  if(d.rendered && !d.dirty) return;
  const st = o.querySelector('.dbody')?.scrollTop;
  const inner = d.kind==='slot' ? slotEditHTML(d) : d.kind==='catalog' ? catalogHTML(d) : d.kind==='project' ? projectHTML(d) : d.kind==='spec' ? specHTML(d) : d.kind==='plan' ? planHTML(d) : d.kind==='layout' ? layoutHTML(d) : d.kind==='render' ? renderHTML(d) : roomHTML(d);
  o.innerHTML = `<div class="scrim" data-act="close"></div><aside class="drawer${d.kind==='layout'?' wide':''}" role="dialog" aria-modal="true">${inner}</aside>`;
  d.rendered = true; d.dirty = false;
  if(st) o.querySelector('.dbody').scrollTop = st;
}

function compress(file, max, limit, cb){
  if(!file || !file.type.startsWith('image/')){ toast('Choose an image file (JPG or PNG).'); return; }
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => { let q=.82, m=max, out, c;
    for(let i=0;i<6;i++){ const s=Math.min(1,m/Math.max(img.width,img.height)); c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); out=c.toDataURL('image/jpeg',q); if(out.length<limit) break; q-=.1; m=Math.round(m*.82); }
    URL.revokeObjectURL(url); cb(out, c); };
  img.onerror = () => { URL.revokeObjectURL(url); toast('That image could not be read. Try a JPG or PNG.'); };
  img.src = url;
}
const dataToBlob = d => { const [h,b]=d.split(','); const bin=atob(b), a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:h.match(/:(.*?);/)[1]}); };
async function uploadAsset(dataUrl){ const res = await S.assets.upload(dataToBlob(dataUrl)); return res.id; }

function millworkList(r, turn){
  const base = planFor(r); if(!base || !base.items) return [];
  const p = turn ? rotPlan(base, turn) : base, W = +p.W, D = +p.D;
  const its = p.items.map(it => ({...it, x:+it.x||0, y:+it.y||0, w:+it.w||0, d:+it.d||0}));
  const fL = n => fmtLen(n), len = it => { const f2 = faceOf(it); return f2==='e'||f2==='w' ? it.d : it.w; };
  const fronts = (it, n) => ({drawers:`a stack of 3 drawers${n>1?` (${n} stacks side by side)`:''}`, drawer_doors:`${n} drawer${n>1?'s':''} over ${n} door${n>1?'s':''}`, blind:'a blind-corner cabinet: one door plus a plain blind panel'}[it.fronts] || `${n} door${n>1?'s':''}`);
  const desc = it => { const L = len(it), n = Math.max(1, Math.round(L/18));
    switch(it.t){
      case 'base': if(it.fronts==='dw'||it.fronts==='dws') return `${it.fronts==='dws'?'stainless':'panel-ready (matches cabinet doors)'} dishwasher ${fL(L)} wide`;
        return `base cabinet ${fL(L)} wide with ${fronts(it,n)}${it.cooktop?', cooktop in the counter':''}${+it.oh?`, countertop overhangs ${fL(+it.oh)}`:''}`;
      case 'sink': return `sink base ${fL(L)} wide with ${n} door${n>1?'s':''}, undermount sink and faucet on top`;
      case 'range': return `freestanding range ${fL(L)} wide`;
      case 'fridge': return `refrigerator ${fL(L)} wide${r.panelFridge?' with cabinet-panel fronts':''}${it.fp&&it.fp!=='none'?`, cabinet side panel${it.fp==='both'?'s on both sides':' on the '+it.fp+' side'}`:''}${it.bridge?', with a cabinet above it':''}`;
      case 'tall': return `tall pantry cabinet ${fL(L)} wide, ${fL(+it.h||90)} tall, ${n} door${n>1?'s':''} per section`;
      case 'uppers': { const z0 = +it.z0||56, z1 = +it.z1||90, nd = +it.nd || Math.max(1, Math.round(L/18));
        return `${z0<=37?'counter-to-ceiling':'wall'} cabinet ${fL(L)} wide, from ${fL(z0)} to ${fL(z1)} above the floor, ${nd} door${nd>1?'s':''}${it.ucl?', under-cabinet lighting':''}`; }
      case 'corner': return `${it.lvl==='wall'?'upper':'base'} corner cabinet, ${it.kind==='diag'?'diagonal with one angled door':'L-shaped with two doors'}`;
      case 'island': { const wf = it.wf, cab = it.cab && it.cab!=='auto' ? ` cabinets only on one long side` : '';
        return `island ${fL(it.w)} × ${fL(it.d)}${cab}, fronts: ${fronts(it, Math.max(1, Math.round(Math.max(it.w,it.d)/16)))}${it.mw?', a microwave drawer':''}${wf==='full'?', solid stone on all sides':wf==='both'?', stone waterfall on both ends':wf==='a'||wf==='b'?', stone waterfall on one end':''}`; }
      case 'counter': return `counter / desk ${fL(it.w)} × ${fL(it.d)}`;
      case 'bench': return `built-in bench ${fL(len(it))} long`;
      case 'panel': return `cabinet end panel`;
      default: return null; } };
  const rows = its.filter(it => desc(it));
  const wallOf = it => { if(it.t==='island') return null;
    if(it.t==='corner'){ const c = it.corner||'nw'; return c==='nw' ? 'left' : c==='ne' ? 'back' : c==='se' ? 'right' : 'front'; }
    const f2 = faceOf(it);
    if(f2==='s' && it.y < 2) return 'back'; if(f2==='e' && it.x < 2) return 'left';
    if(f2==='w' && it.x + it.w > W - 2) return 'right'; if(f2==='n' && it.y + it.d > D - 2) return 'front'; return null; };
  const WALLS = [['left','Upper-left wall of the image, from the back corner toward the viewer', it=>it.y],
    ['back','Upper-right wall of the image, from the back corner toward the right', it=>it.x],
    ['right','Near right side (cut away in the drawing), from the back toward the viewer', it=>it.y],

function jump(k){

  const y = el.getBoundingClientRect().top + window.scrollY - (narrow && viz ? viz.offsetHeight + 12 : 16);

}

    case 'approve': { const r=room(); if(await saveRoom(r, {approved:{at:new Date().toISOString(), by:role()}})) toast(`${r.name} finishes approved`); break; }
    case 'reopen': if(await saveRoom(room(), {approved:null})) toast('Reopened for changes'); break;
    case 'lightbox': { const pl = S.plans.find(x=>x.id===t.dataset.id); const list = S.view==='plans' ? S.plans.filter(x=>x.asset) : S.plans.filter(x=>x.asset && x.room===pl.room); S.lb = {list, i: list.indexOf(pl)}; renderOverlay(); break; }
    case 'lbPrev': S.lb.i = (S.lb.i - 1 + S.lb.list.length) % S.lb.list.length; renderOverlay(); break;
    case 'lbNext': S.lb.i = (S.lb.i + 1) % S.lb.list.length; renderOverlay(); break;
    case 'lbClose': S.lb = null; renderOverlay(); break;
    case 'editSlot': { const r=room(); S.drawer={kind:'slot', k:t.dataset.k, options:JSON.parse(JSON.stringify(r.slots[t.dataset.k].options)), photos:{}, removed:[]}; renderOverlay(); break; }
    case 'addOpt': readSlotForm(); d.options.push({id:'o'+newId(), name:'', detail:'', color:'#cccccc', texture:'plain', price:0, url:''}); redraw(); break;
    case 'rmOpt': { readSlotForm(); const [o] = d.options.splice(+t.dataset.i,1); d.removed.push(o.id); delete d.photos[o.id]; redraw(); break; }
    case 'rmPhoto': { readSlotForm(); const o = d.options[+t.dataset.i]; delete o.img; delete o.imgUrl; d.photos[o.id] = ''; redraw(); break; }
    case 'catalog': S.drawer = {kind:'catalog', k:t.dataset.k, sub:''}; renderOverlay(); break;
    case 'catSub': d.sub = t.dataset.sub; redraw(); break;
    case 'pickCat': pickCatalog(t.dataset.k, t.dataset.slug); break;
    case 'saveSlot': saveSlot(); break;
    case 'close': S.drawer=null; renderOverlay(); break;
    case 'newProject': S.drawer={kind:'project'}; renderOverlay(); break;
    case 'editProject': S.drawer={kind:'project', ...project()}; renderOverlay(); break;
    case 'askDel': if(d.kind==='room') readRoomForm(d); d.confirm=true; redraw(); break;
    case 'noDel': d.confirm=false; redraw(); break;
    case 'saveProject': {
      const v = readForm('pForm'); if(!v.name){ toast('Give the project a name.'); return; }
      const id = d.id || newId(), body = {...v, updatedAt:new Date().toISOString()};
      if('clients' in v) body.clients = String(v.clients||'').split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(x=>x.includes('@'));
      try{ if(d.id) await S.db.doc(`projects/${id}`).update(body); else await S.db.doc(`projects/${id}`).set(body);
        S.drawer=null; renderOverlay();
        if(!d.id){ selectProject(id); S.view='rooms'; S.drawer={kind:'room', type:'kitchen', name:''}; renderOverlay(); toast('Project created. Now add a room.'); } else toast('Project saved');
      }catch(err){ writeErr(err); }
      break; }
    case 'delProject': {
      try{ for(const sub of ['rooms','specs','plans','photos']) await delAll(`projects/${S.pid}/${sub}`);
        await S.db.doc(`projects/${S.pid}`).delete(); S.drawer=null; renderOverlay(); toast('Project deleted'); }catch(err){ writeErr(err); }
      break; }
    case 'addRoom': S.drawer={kind:'room', type:'kitchen', name:''}; renderOverlay(); break;
    case 'roomSettings': { const r=room(); S.drawer={kind:'room', id:r.id, name:r.name, wainscot:r.wainscot||'', panelFridge:!!r.panelFridge, layout:r.layout||null}; renderOverlay(); break; }
    case 'rtype': readRoomForm(d); d.type=t.dataset.t; d.layout=null; redraw(); break;
    case 'rlayout': readRoomForm(d); d.layout=t.dataset.l; redraw(); break;
    case 'editLayout': openLayoutEditor(); break;
    case 'addFinish': { const r = room(), k = t.dataset.k; if(!r || r.slots[k]) break; const src = k==='hood' ? HOOD_OPTS : CROWN_OPTS, options = src.map((o,i)=>({id:`${k}${i+1}`, url:'', ...o}));
      if(await saveRoom(r, {slots:{...JSON.parse(JSON.stringify(r.slots)), [k]:{options, chosen:`${k}1`}}})){ toast(`${k==='hood'?'Range hood':'Crown moulding'} added. Pick a style below.`); setTimeout(()=>jump(k), 80); } break; }
    case 'leAdd': { const def = ITEM_DEFS[t.dataset.t], p = d.plan; const it = WALL_ITEMS.includes(t.dataset.t) ? {t:t.dataset.t, wall:'back', a:Math.round(+p.W/2 - def.w/2), len:def.w, uid:newId()} : {t:t.dataset.t, x:Math.round(+p.W/2 - def.w/2), y:Math.round(+p.D/2 - def.d/2), w:def.w, d:def.d, uid:newId()};
      if(['vanity','base','sink','uppers','tall','fridge','range','bench'].includes(it.t)) it.y = 0;
      if(it.t==='panel'){ it.y = 0; it.h = 90; }
      if(it.t==='dishwasher'){ it.t = 'base'; it.fronts = 'dw'; it.y = 0; }
      if(it.t==='corner'){ it.x = 0; it.y = 0; it.kind = 'l'; it.corner = 'nw'; it.arm = 24; } if(['partition','void'].includes(it.t)) it.id = 'w' + newId(); leClamp(it,p); p.items.push(it); d.sel = it.uid; leRefresh(true); break; }
    case 'leSplitStools': { const isl = d.plan.items.find(i=>i.uid===d.sel); if(!isl) break; const cols2 = d.plan.items.filter(i=>i.t==='column').map(c=>({...c,x:+c.x,y:+c.y,w:+c.w,d:+c.d}));
      autoStoolSpots({...isl, x:+isl.x, y:+isl.y, w:+isl.w, d:+isl.d}, cols2).forEach(p2 => d.plan.items.push({t:'stool', x:Math.round(p2.x), y:Math.round(p2.y), w:p2.w, d:p2.d, face:p2.face, uid:newId()+Math.random().toString(36).slice(2,5)}));
      isl.stools = 'none'; leRefresh(true); toast('Stools placed. Drag them, change their direction, or delete any of them.'); break; }
    case 'leTurn': { d.turn = ((d.turn||0) + +t.dataset.d + 4) % 4; const iso = $('#leIso'); if(iso) iso.innerHTML = leIsoHTML(d); break; }
    case 'leDel': { const gone = d.plan.items.find(i=>i.uid===d.sel); d.plan.items = d.plan.items.filter(i=>i.uid!==d.sel);
      if(gone && gone.id) d.plan.items.forEach(w => { if(w.wall==='host' && w.host===gone.id){ setWall(w, {wall:'back', a:0, len:+w.len||32}); leClamp(w, d.plan); } });
      d.sel=null; leRefresh(true); break; }
    case 'leDup': { const it = d.plan.items.find(i=>i.uid===d.sel); if(it){ const c = {...it, uid:newId(), x:+it.x+12, y:+it.y+12}; if(c.id) c.id = 'w' + newId(); leClamp(c,d.plan); d.plan.items.push(c); d.sel=c.uid; leRefresh(true); } break; }
    case 'leRotate': { const it = d.plan.items.find(i=>i.uid===d.sel); if(it){ const nxt = {s:'e',e:'n',n:'w',w:'s'}[faceOf(it)]; if(WALL_ITEMS.includes(it.t)){ const wi = wallInfo(it), order = ['back','left','front','right'].concat(chamferOf(d.plan)?['diag']:[]); wi.wall = wi.wall==='host' ? 'back' : order[(order.indexOf(wi.wall)+1)%order.length]; setWall(it, wi); } else { if(it.t==='corner') it.corner = {nw:'ne', ne:'se', se:'sw', sw:'nw'}[it.corner || 'nw']; const cx = +it.x + +it.w/2, cy = +it.y + +it.d/2, t2=it.w; it.w=it.d; it.d=t2; it.x = Math.round((cx - it.w/2)*8)/8; it.y = Math.round((cy - it.d/2)*8)/8; it.face=nxt; } leClamp(it,d.plan); leRefresh(true); } break; }
    case 'leSave': {
      const r = room(), clean = {W:+(+d.plan.W).toFixed(3), D:+(+d.plan.D).toFixed(3), ...(chamferOf(d.plan)?{chamfer:{a:+d.plan.chamfer.a, b:+d.plan.chamfer.b}}:{}), ...((d.plan.open||[]).length?{open:[...d.plan.open]}:{}), ...(d.plan.ext && Object.keys(d.plan.ext).length?{ext:{...d.plan.ext}}:{}), ...(d.plan.accent?{accent:d.plan.accent}:{}), items:d.plan.items.map(it=>{ const o={...it}; delete o.uid; delete o.i; ['x','y','w','d','z0','z1','h','a','len','dw','ch','cw','mwAt','oh','arm','bw','bz1'].forEach(k=>{ if(o[k]!==undefined) o[k]=Math.round(+o[k]*8)/8; }); return o; })};
      const patch = {plan:clean, layout:'plan', wainscot: +d.wain || 0};
      if(clean.accent && !r.slots.accent) patch.slots = {...JSON.parse(JSON.stringify(r.slots)), accent:{options:ACCENT_OPTS.map((o,i)=>({id:`accent${i+1}`, url:'', ...o})), chosen:'accent1'}};
      if(await saveRoom(r, patch)){ S.drawer=null; renderOverlay(); toast('Layout saved'); }
      break; }
    case 'saveRoomSettings': {
      readRoomForm(d);
      const type = d.id ? room().type : d.type;
      const name = String(d.name||'').trim() || (d.id ? room().name : TEMPLATES[type].label);
      const extra = {}; if(type==='bath'||type==='powder') extra.wainscot = +d.wainscot||0; if(type==='kitchen') extra.panelFridge = !!d.panelFridge; if(LAYOUTS[type]){ extra.layout = d.layout || (d.id ? room().layout : null) || LAYOUTS[type][0][0]; if(d.id && d.layout && d.layout !== room().layout) extra.plan = null; }
      try{
        if(d.id) await S.db.doc(`projects/${S.pid}/rooms/${d.id}`).update({name, ...extra});
        else { const id = newId(); await S.db.doc(`projects/${S.pid}/rooms/${id}`).set({...roomFromTemplate(type, name), ...extra}); S.rid=id; savePrefs(); }
        await S.db.doc(`projects/${S.pid}`).update({updatedAt:new Date().toISOString()}).catch(()=>{});
        S.drawer=null; renderOverlay(); toast(d.id?'Room saved':`${name} added`);
      }catch(err){ writeErr(err); }
      break; }
    case 'delRoom': try{ await S.db.doc(`projects/${S.pid}/rooms/${d.id}`).delete(); S.drawer=null; renderOverlay(); toast('Room deleted'); }catch(err){ writeErr(err); } break;
    case 'addSpec': S.drawer={kind:'spec', item:{room: t.dataset.room || (room()?.id) || 'general', category:'Plumbing'}}; renderOverlay(); break;
    case 'editSpec': S.drawer={kind:'spec', item:{...S.specs.find(s=>s.id===t.dataset.id)}}; renderOverlay(); break;
    case 'saveSpec': {
      const v = readForm('specForm'), id = d.item.id || newId();
      const body = {...v, order: d.item.order ?? Date.now()}; Object.keys(body).forEach(k=>{ if(body[k]==='') delete body[k]; }); body.room = v.room; body.category = v.category;
      try{ await S.db.doc(`projects/${S.pid}/specs/${id}`).set(body); S.drawer=null; renderOverlay(); toast(d.item.id?'Item saved':'Item added'); }catch(err){ writeErr(err); }
      break; }
    case 'delSpec': try{ await S.db.doc(`projects/${S.pid}/specs/${d.item.id}`).delete(); S.drawer=null; renderOverlay(); toast('Item deleted'); }catch(err){ writeErr(err); } break;
    case 'addPlan': S.drawer={kind:'plan', item:{}}; renderOverlay(); break;
    case 'editPlan': S.drawer={kind:'plan', item:{...S.plans.find(p=>p.id===t.dataset.id)}}; renderOverlay(); break;
    case 'savePlan': {
      const v = readForm('planForm'); if(!v.title && !d.preview && !d.item.asset){ toast('Add a title or an image.'); return; }
      const btn = t; btn.disabled = true;
      try{
        let asset = d.item.asset;
        if(d.preview){ asset = await uploadAsset(d.preview); }
        const id = d.item.id || newId(), body = {title:v.title, notes:v.notes, room:v.room, order: d.item.order ?? Date.now()};
        if(asset) body.asset = asset;
        await S.db.doc(`projects/${S.pid}/plans/${id}`).set(body); S.drawer=null; renderOverlay(); toast('Saved');
      }catch(err){ btn.disabled=false; if(err && err.code && /quota|too_large|unsupported/.test(err.code)) toast('That image could not be stored. Try a smaller file.'); else writeErr(err); }
      break; }
    case 'delPlan': try{ await S.db.doc(`projects/${S.pid}/plans/${d.item.id}`).delete(); if(d.item.asset && S.assets) S.assets.delete(d.item.asset).catch(()=>{}); S.drawer=null; renderOverlay(); toast('Deleted'); }catch(err){ writeErr(err); } break;
    case 'exportCsv': exportCsv(); break;
  }
});
// highlight a finish in the drawing only while the mouse points at its title, one of its option cards, its chip, or the surface itself
document.addEventListener('pointerover', e => {
  if(e.pointerType && e.pointerType!=='mouse') return;
  const s = e.target.closest('.slot-h, .opt[data-k], .chipf, svg.iso .s[data-slot]');
  const k = !s ? null : s.classList.contains('slot-h') ? (s.closest('.slot[data-k]')||{dataset:{}}).dataset.k || null : (s.dataset.k || s.dataset.slot);
  if(k !== S.hover){ clearTimeout(jump.t); S.hover = k; applyFocus(); }
});
document.addEventListener('input', e => { if(e.target.id==='q'){ S.q=e.target.value; clearTimeout(S.qt); S.qt=setTimeout(render,200); } });
document.addEventListener('change', e => {
  if(leField(e)) return;
  const id = e.target.id, d = S.drawer;
  if(id==='viewAs'){ S.viewAs=e.target.value; render(); }
  if(id==='rCam' && d && d.kind==='render'){ d.cam = e.target.value; d.prompt = renderPrompt(room(), d.turn||0, d.cam); redraw(); return; }
  if(id==='hideBlank'){ S.hideBlank=e.target.checked; render(); }
  if(id==='waste'){ S.waste = Math.max(0, Math.min(50, +e.target.value || 0)); savePrefs(); render(); }
  if(id==='projSel'){ if(e.target.value==='__new'){ e.target.value=S.pid||''; S.drawer={kind:'project'}; renderOverlay(); } else selectProject(e.target.value); }
  if(e.target.dataset.photo!==undefined){ optionPhoto(+e.target.dataset.photo, e.target.files[0]); }
  if(id==='p_file'){ const v = readForm('planForm'); Object.assign(d.item, v); compress(e.target.files[0], 2200, 2500000, data => { d.preview = data; redraw(); }); }
  if(e.target.closest('.orow') && (e.target.dataset.f==='color'||e.target.dataset.f==='texture'||e.target.dataset.f==='color2'||e.target.dataset.f==='photoW'||e.target.dataset.f==='angle')){ readSlotForm(); redraw(); }
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ if(S.lb){ S.lb=null; renderOverlay(); } else if(S.drawer){ S.drawer=null; renderOverlay(); } }
  if(S.lb && e.key==='ArrowRight'){ S.lb.i=(S.lb.i+1)%S.lb.list.length; renderOverlay(); }
  if(S.lb && e.key==='ArrowLeft'){ S.lb.i=(S.lb.i-1+S.lb.list.length)%S.lb.list.length; renderOverlay(); }
});
document.addEventListener('submit', e => e.preventDefault());

render();
init();
})();
</script>
</body>
</html>
